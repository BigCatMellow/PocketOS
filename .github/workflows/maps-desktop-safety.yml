name: Apply desktop ROM tool safety hardening

on:
  push:
    branches: [maps-reliability-v1.3]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: maps-reliability-v1.3
          fetch-depth: 0
      - name: Install GUI test dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk
      - name: Apply hardening
        run: python3 tools/_maps_desktop_safety_patch.py
      - name: Verify
        run: |
          python3 -m unittest discover -v
          bash -n tools/pocketos_stress_test.sh tools/onion_baseline_monitor.sh tools/launcher_comparison_monitor.sh
      - name: Commit verified hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/onion_systems.py tools/installer.py tools/rom_importer.py tools/genre_scanner.py tests/test_rom_tool_safety.py docs/roadmap-v1.3-reliability.md
          git commit -m "fix: harden desktop ROM data handling"
          git push origin HEAD:maps-reliability-v1.3
