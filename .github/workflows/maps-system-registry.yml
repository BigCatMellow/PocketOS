name: Apply Onion system registry migration

on:
  push:
    branches: [maps-reliability-v1.3]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: maps-reliability-v1.3
          fetch-depth: 0
      - name: Apply migration
        run: python3 tools/_maps_system_registry_patch.py
      - name: Verify
        run: |
          python3 -m unittest discover -v
          bash -n tools/pocketos_stress_test.sh tools/onion_baseline_monitor.sh tools/launcher_comparison_monitor.sh
      - name: Commit verified migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/installer.py tools/rom_importer.py tools/genre_scanner.py src/pocketOS/pocketOS.c tests/test_onion_systems.py docs/roadmap-v1.3-reliability.md
          git commit -m "fix: align ROM tools with Onion system folders"
          git push origin HEAD:maps-reliability-v1.3
