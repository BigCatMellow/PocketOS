name: Reliability follow-up patch

on:
  push:
    branches: [maps-reliability-v1.3]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: maps-reliability-v1.3
          fetch-depth: 0
      - name: Install GUI test dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk
      - name: Apply focused follow-up
        run: python3 tools/_maps_followup_patch.py
      - name: Verify full safety suite
        run: |
          python3 -m unittest discover -v
          bash -n tools/pocketos_stress_test.sh tools/onion_baseline_monitor.sh tools/launcher_comparison_monitor.sh
      - name: Remove one-shot patch scaffolding
        run: |
          git rm tools/_maps_followup_patch.py .github/workflows/maps-followup.yml
      - name: Commit verified follow-up
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/installer.py tools/rom_importer.py tests/test_installer.py tests/test_rom_tool_safety.py
          git commit -m "fix: close ROM import safety gaps"
          git push origin HEAD:maps-reliability-v1.3
